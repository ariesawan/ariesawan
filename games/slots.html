<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine - LuckyBet Casino</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="game-header">
            <div class="logo">
                <h1>🎰 Slot Machine</h1>
            </div>
            <div class="user-info">
                <span class="balance">Saldo: Rp <span id="userBalance">10,000,000</span></span>
                <a href="../dashboard.html" class="btn btn-small">Kembali</a>
            </div>
        </header>

        <main class="game-container">
            <div class="slot-machine">
                <div class="slot-display">
                    <div class="reel" id="reel1">🍒</div>
                    <div class="reel" id="reel2">🍋</div>
                    <div class="reel" id="reel3">🍊</div>
                </div>

                <div class="bet-section">
                    <div class="form-group">
                        <label>Taruhan (Rp)</label>
                        <select id="betAmount">
                            <option value="10000">10,000</option>
                            <option value="50000">50,000</option>
                            <option value="100000" selected>100,000</option>
                            <option value="500000">500,000</option>
                            <option value="1000000">1,000,000</option>
                        </select>
                    </div>
                    <button class="btn btn-primary btn-large" id="spinBtn">PUTAR</button>
                </div>

                <div class="result-message" id="resultMessage"></div>

                <div class="paytable">
                    <h3>Tabel Pembayaran</h3>
                    <table>
                        <tr>
                            <td>🍒 🍒 🍒</td>
                            <td>3x Taruhan</td>
                        </tr>
                        <tr>
                            <td>🍋 🍋 🍋</td>
                            <td>5x Taruhan</td>
                        </tr>
                        <tr>
                            <td>🍊 🍊 🍊</td>
                            <td>7x Taruhan</td>
                        </tr>
                        <tr>
                            <td>🍇 🍇 🍇</td>
                            <td>10x Taruhan</td>
                        </tr>
                        <tr>
                            <td>🔔 🔔 🔔</td>
                            <td>15x Taruhan</td>
                        </tr>
                        <tr>
                            <td>💎 💎 💎</td>
                            <td>50x Taruhan</td>
                        </tr>
                        <tr>
                            <td>⭐ ⭐ ⭐</td>
                            <td>100x Taruhan (JACKPOT!)</td>
                        </tr>
                    </table>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 LuckyBet Casino. Main dengan bertanggung jawab.</p>
        </footer>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/slots.js"></script>
</body>
</html>
